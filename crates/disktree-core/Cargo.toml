[package]
name = "disktree-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Filesystem scanning and treemap layout for disktree"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rayon = { workspace = true }
rustix = { version = "1.1", features = ["fs"] }
rustc-hash = { workspace = true }

# macOS: the mount table (getfsstat) and file flags come from libc, and the
# Finder trash from Foundation. Both are gated so the crate stays portable.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString", "NSDictionary", "NSArray", "NSValue", "NSObject"] }

[dev-dependencies]
tempfile = "3"
